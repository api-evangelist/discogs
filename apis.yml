aid: discogs
name: Discogs
description: 'Discogs is a community-built music database and marketplace for physical
  music releases (vinyl, CD, cassette, and more). The Discogs API gives developers
  programmatic

  read/write access to artists, releases, masters, labels, search, user collections
  and wantlists, marketplace listings, orders, and inventory management — using Discogs

  Auth tokens, key+secret credentials, or full OAuth 1.0a on behalf of other users.

  '
