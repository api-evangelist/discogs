features:
- name: Database Search
  description: Free-text search across releases, masters, artists, and labels with
    rich filters (year, country, format, label, genre, style, barcode, catno).
- name: Release Catalog
  description: Detailed release records including tracks, formats, labels, artists,
    videos, identifiers, community stats, and marketplace stats.
- name: User Collection Management
  description: Read and modify user record collections, organized into custom folders
    with notes and rating per copy.
- name: User Wantlist
  description: Track wanted releases, with notes and ratings; add and remove releases
    programmatically.
- name: Marketplace Listings
  description: List, update, and delete records for sale; query inventory by username;
    integrate with checkout flows via the Listing endpoints.
- name: Marketplace Orders
  description: Inspect, update, and message on orders the authenticated seller has
    received.
- name: Price Suggestions
  description: Get Discogs-calculated suggested marketplace prices by release and
    media condition.
- name: Bulk Inventory Management
  description: CSV-driven bulk add, change, and delete of inventory listings via asynchronous
    upload jobs; full inventory export to CSV.
- name: OAuth 1.0a
  description: Three-legged OAuth 1.0a flow for building third-party apps that act
    on behalf of other Discogs users.
- name: Monthly XML Data Dumps
  description: Discogs publishes a monthly snapshot of the full database (artists,
    labels, masters, releases) as XML on S3 for bulk analysis.
useCases:
- name: Music Discovery Apps
  description: Build apps that surface release metadata, cover art, video links, community
    ratings, and label discographies.
- name: Vinyl Reseller Tools
  description: Power inventory management, pricing, and order workflows for vinyl
    resellers selling on the Discogs Marketplace.
- name: Collection Trackers
  description: Mobile and desktop apps that sync a collector's Discogs collection
    and wantlist offline.
- name: Catalog Enrichment
  description: Enrich third-party music libraries (DJ tools, archive systems, streaming
    metadata) with Discogs identifiers, formats, and release dates.
- name: AI Music Agents
  description: Power LLM-driven shopping, discovery, and collection-management agents
    via the Discogs MCP server ecosystem.
- name: Research and Analytics
  description: Use the monthly XML data dumps for population-level analysis of pressing
    variants, label catalogs, and marketplace pricing.
integrations:
- name: OAuth 1.0a
  description: Standards-compliant OAuth 1.0a for delegated user authorization.
- name: CSV
  description: Bulk inventory imports and exports use CSV files.
- name: Microcks
  description: OpenAPI spec is annotated with x-microcks-operation extensions for
    mock-server compatibility.
- name: Model Context Protocol
  description: Five plus community MCP servers expose Discogs surfaces (search, collection,
    wantlist, marketplace) as MCP tools for LLM agents.
solutions:
- name: Marketplace Storefront Sync
  description: Combine inventory upload, order management, and price suggestions to
    operate a multi-channel record store with Discogs as inventory of record.
- name: Collector Mobile Companion
  description: Combine identity, collection, wantlist, and search to build a fully-featured
    mobile companion for record collectors.
- name: Catalog Resolution Service
  description: Use search and release endpoints to resolve fuzzy track metadata into
    canonical Discogs IDs and master release versions.
