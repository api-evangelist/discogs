        method: GET
        description: Get a master release
        inputParameters:
        - name: master_id
          in: path
          type: integer
          required: true
          description: The ID of the master release.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: masters-master-id-versions
      path: /masters/{master_id}/versions
      operations:
      - name: getmasterreleaseversions
        method: GET
        description: Get master release versions
        inputParameters:
        - name: master_id
          in: path
          type: integer
          required: true
          description: The ID of the master release.
        - name: page
          in: query
          type: integer
          required: false
          description: The page number to return.
        - name: per_page
          in: query
          type: integer
          required: false
          description: The number of items to return per page.
        - name: format
          in: query
          type: string
          required: false
          description: Filter by format.
        - name: label
          in: query
          type: string
          required: false
          description: Filter by label.
        - name: released
          in: query
          type: string
          required: false
          description: Filter by release year.
        - name: country
          in: query
          type: string
          required: false
          description: Filter by country.
        - name: sort
          in: query
          type: string
          required: false
          description: The field to sort the results by.
        - name: sort_order
          in: query
          type: string
          required: false
          description: The order to sort the results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: releases-release-id
      path: /releases/{release_id}
      operations:
      - name: getrelease
        method: GET
        description: Get a release
        inputParameters:
        - name: release_id
          in: path
          type: integer
          required: true
          description: The ID of the release.
        - name: curr_abbr
          in: query
          type: string
          required: false
          description: Currency for marketplace data.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: releases-release-id-rating
      path: /releases/{release_id}/rating
      operations:
      - name: getreleasecommunityrating
        method: GET
        description: Discogs Get Release Community Rating
        inputParameters:
        - name: release_id
          in: path
          type: integer
          required: true
          description: Release ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: releases-release-id-rating-username
      path: /releases/{release_id}/rating/{username}
      operations:
      - name: getreleaseratingbyuser
        method: GET
        description: Discogs Get Release Rating by User
        inputParameters:
        - name: release_id
          in: path
          type: integer
          required: true
          description: Release ID.
        - name: username
          in: path
          type: string
          required: true
          description: Discogs username.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatereleaseratingbyuser
        method: PUT
        description: Discogs Update Release Rating by User
        inputParameters:
        - name: release_id
          in: path
          type: integer
          required: true
          description: Release ID.
        - name: username
          in: path
          type: string
          required: true
          description: Discogs username.
        - name: body
          in: body
          type: object
          required: true
          description: Request body (JSON).
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletereleaseratingbyuser
        method: DELETE
        description: Discogs Delete Release Rating by User
        inputParameters:
        - name: release_id
          in: path
          type: integer
          required: true
          description: Release ID.
        - name: username
          in: path
          type: string
          required: true
          description: Discogs username.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
