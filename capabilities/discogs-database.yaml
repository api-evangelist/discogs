naftiko: 1.0.0-alpha2
info:
  label: Discogs API — Database
  description: 'Discogs — Database. 12 operations. Lead operation: Get an artist. Self-contained Naftiko capability covering one Discogs business surface.'
  tags:
  - Discogs
  - Music
  - Database
  created: '2026-05-29'
  modified: '2026-05-29'
binds:
- namespace: env
  keys:
    DISCOGS_TOKEN: DISCOGS_TOKEN
capability:
  consumes:
  - type: http
    namespace: discogs-database
    baseUri: https://api.discogs.com
    description: Discogs API — Database business capability. Self-contained, no shared references.
    authentication:
      type: apikey
      key: Authorization
      value: Discogs token={{env.DISCOGS_TOKEN}}
      placement: header
    resources:
    - name: artists-artist-id
      path: /artists/{artist_id}
      operations:
      - name: getartist
        method: GET
        description: Get an artist
        inputParameters:
        - name: artist_id
          in: path
          type: integer
          required: true
          description: The ID of the artist.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: artists-artist-id-releases
      path: /artists/{artist_id}/releases
      operations:
      - name: getartistreleases
        method: GET
        description: Get artist releases
        inputParameters:
        - name: artist_id
          in: path
          type: integer
          required: true
          description: The ID of the artist.
        - name: page
          in: query
          type: integer
          required: false
          description: The page number to return.
        - name: per_page
          in: query
          type: integer
          required: false
          description: The number of items to return per page.
        - name: sort
          in: query
          type: string
          required: false
          description: The field to sort the results by.
        - name: sort_order
          in: query
          type: string
          required: false
          description: The order to sort the results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: database-search
      path: /database/search
      operations:
      - name: searchdatabase
        method: GET
        description: Search the database
        inputParameters:
        - name: query
          in: query
          type: string
          required: false
          description: Your search query.
        - name: type
          in: query
          type: string
          required: false
          description: The type of resource to search for.
        - name: title
          in: query
          type: string
          required: false
          description: Search by combined "Artist Name - Release Title" field.
        - name: release_title
          in: query
          type: string
          required: false
          description: Search release titles.
        - name: credit
          in: query
          type: string
          required: false
          description: Search release credits.
        - name: artist
          in: query
          type: string
          required: false
          description: Search artist names.
        - name: anv
          in: query
          type: string
          required: false
          description: Search an "Artist Name Variation" (ANV).
        - name: label
          in: query
          type: string
          required: false
          description: Search label names.
        - name: genre
          in: query
          type: string
          required: false
          description: Search genres.
        - name: style
          in: query
          type: string
          required: false
          description: Search styles.
        - name: country
          in: query
          type: string
          required: false
          description: Search release country.
        - name: year
          in: query
          type: string
          required: false
          description: Search release year.
        - name: format
          in: query
          type: string
          required: false
          description: Search formats.
        - name: catno
          in: query
          type: string
          required: false
          description: Search catalog number.
        - name: barcode
          in: query
          type: string
          required: false
          description: Search barcodes.
        - name: track
          in: query
          type: string
          required: false
          description: Search track titles.
        - name: submitter
          in: query
          type: string
          required: false
          description: Search by submitter username.
        - name: contributor
          in: query
          type: string
          required: false
          description: Search by contributor username.
        - name: page
          in: query
          type: integer
          required: false
          description: The page number to return.
        - name: per_page
          in: query
          type: integer
          required: false
          description: The number of items to return per page.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: labels-label-id
      path: /labels/{label_id}
      operations:
      - name: getlabel
        method: GET
        description: Get a label
        inputParameters:
        - name: label_id
          in: path
          type: integer
          required: true
          description: The ID of the label.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: labels-label-id-releases
      path: /labels/{label_id}/releases
      operations:
      - name: getlabelreleases
        method: GET
        description: Get all label releases
        inputParameters:
        - name: label_id
          in: path
          type: integer
          required: true
          description: The ID of the label.
        - name: page
          in: query
          type: integer
          required: false
          description: The page number to return.
        - name: per_page
          in: query
          type: integer
          required: false
          description: The number of items to return per page.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: masters-master-id
