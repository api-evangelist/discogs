        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletelisting
        method: DELETE
        description: Delete a listing
        inputParameters:
        - name: listing_id
          in: path
          type: integer
          required: true
          description: The ID of the marketplace listing.
