naftiko: 1.0.0-alpha2
info:
  label: Discogs API — Marketplace
  description: 'Discogs — Marketplace. 14 operations. Lead operation: Discogs Get Marketplace Fee. Self-contained Naftiko capability covering one Discogs business surface.'
  tags:
  - Discogs
  - Music
  - Marketplace
  created: '2026-05-29'
  modified: '2026-05-29'
binds:
- namespace: env
  keys:
    DISCOGS_TOKEN: DISCOGS_TOKEN
capability:
  consumes:
  - type: http
    namespace: discogs-marketplace
    baseUri: https://api.discogs.com
    description: Discogs API — Marketplace business capability. Self-contained, no shared references.
    authentication:
      type: apikey
      key: Authorization
      value: Discogs token={{env.DISCOGS_TOKEN}}
      placement: header
    resources:
    - name: marketplace-fee-price
      path: /marketplace/fee/{price}
      operations:
      - name: getmarketplacefee
        method: GET
        description: Discogs Get Marketplace Fee
        inputParameters:
        - name: price
          in: path
          type: number
          required: true
          description: Transaction price in USD.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: marketplace-fee-price-currency
      path: /marketplace/fee/{price}/{currency}
      operations:
      - name: getmarketplacefeewithcurrency
        method: GET
        description: Discogs Get Marketplace Fee With Currency
        inputParameters:
        - name: price
          in: path
          type: number
          required: true
          description: Transaction price.
        - name: currency
          in: path
          type: string
          required: true
          description: ISO currency code.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: marketplace-listings
      path: /marketplace/listings
      operations:
      - name: createlisting
        method: POST
        description: Create a new listing
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Request body (JSON).
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: marketplace-listings-listing-id
      path: /marketplace/listings/{listing_id}
      operations:
      - name: getlisting
        method: GET
        description: Get a listing
        inputParameters:
        - name: listing_id
          in: path
          type: integer
          required: true
          description: The ID of the marketplace listing.
        - name: curr_abbr
          in: query
          type: string
          required: false
          description: Currency for marketplace data.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: editlisting
        method: POST
        description: Edit a listing
        inputParameters:
        - name: listing_id
          in: path
          type: integer
          required: true
          description: The ID of the marketplace listing.
        - name: body
          in: body
          type: object
          required: true
          description: Request body (JSON).
