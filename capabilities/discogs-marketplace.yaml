      - name: listorders
        method: GET
        description: Discogs List Orders
        inputParameters:
        - name: status
          in: query
          type: string
          required: false
          description: Filter by order status.
        - name: created_after
          in: query
          type: string
          required: false
          description: Return orders created after this ISO 8601 datetime.
        - name: created_before
          in: query
          type: string
          required: false
          description: Return orders created before this ISO 8601 datetime.
        - name: archived
          in: query
          type: boolean
          required: false
          description: Whether to include archived orders.
        - name: sort
          in: query
          type: string
          required: false
          description: Sort field.
        - name: sort_order
          in: query
          type: string
          required: false
          description: Sort order.
        - name: page
          in: query
          type: integer
          required: false
          description: Page number.
        - name: per_page
          in: query
          type: integer
          required: false
          description: Items per page.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
