      path: /marketplace/orders/{order_id}
      operations:
      - name: getorder
        method: GET
        description: Discogs Get Order
        inputParameters:
        - name: order_id
          in: path
          type: string
          required: true
          description: Order ID (e.g. 1-1).
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateorder
        method: POST
        description: Discogs Update Order
        inputParameters:
        - name: order_id
          in: path
          type: string
          required: true
          description: Order ID.
        - name: body
          in: body
          type: object
          required: true
