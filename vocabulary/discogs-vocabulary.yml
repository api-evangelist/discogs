  workflow: discogs-marketplace
  personas:
  - music-catalog-engineer
  - marketplace-operator
  - record-collector
  - llm-music-agent
- resource: user-identity
  operations: *id006
  workflow: discogs-user-identity
  personas:
  - music-catalog-engineer
  - marketplace-operator
  - record-collector
  - llm-music-agent
- resource: user-collection
  operations: *id007
  workflow: discogs-user-collection
